<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>金幣酷跑 Run for Coins</title>
    <meta name="description" content="3D 火車軌道跑酷遊戲：左右換道、跳躍、滑鏟，一路吃金幣。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="game"></div>

    <div id="loading" class="loading">
      <div class="coin-spin" aria-hidden="true"></div>
      <p>車站準備中…</p>
    </div>

    <!-- 遊戲中 HUD -->
    <header id="hud" class="hud" hidden>
      <div class="hud-score">
        <span class="label">分數</span>
        <span id="score" class="num">0</span>
        <span id="dist" class="sub">0 m</span>
      </div>
      <div class="hud-right">
        <div id="coinBox" class="coin-pill" aria-label="金幣">
          <i class="coin-icon" aria-hidden="true"></i>
          <span id="coins" class="num">0</span>
        </div>
        <button id="pauseBtn" class="icon-btn" aria-label="暫停">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
        </button>
      </div>
    </header>

    <button id="muteBtn" class="icon-btn mute-btn" aria-label="靜音" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
    </button>

    <div id="toast" class="toast" hidden></div>

    <!-- 開始畫面 -->
    <section id="startScreen" class="start" hidden>
      <div class="brand">
        <p class="line-tag"><span class="dot"></span>METRO LINE 88 · 金幣大道 方向</p>
        <h1><span class="h-en">RUN FOR<br />COINS</span><span class="h-zh">金幣酷跑</span></h1>
      </div>
      <div class="start-card">
        <dl class="stats">
          <div><dt>最高分</dt><dd id="bestStart" class="num">0</dd></div>
          <div><dt>金幣存款</dt><dd id="bankStart" class="num">0</dd></div>
        </dl>
        <button id="startBtn" class="btn-primary">開始奔跑</button>
        <ul class="controls">
          <li><kbd>←</kbd><kbd>→</kbd><span>換軌道</span></li>
          <li><kbd>↑</kbd><kbd>空白</kbd><span>跳躍</span></li>
          <li><kbd>↓</kbd><span>滑鏟 / 快速落地</span></li>
          <li><kbd>P</kbd><span>暫停</span></li>
        </ul>
        <p class="touch-hint">手機：左右滑換道，上滑跳，下滑鏟</p>
        <p class="tip">踩上黃黑斜坡可以跑上車頂。迎面亮燈的列車會開過來！</p>
      </div>
    </section>

    <!-- 暫停 -->
    <section id="pauseScreen" class="overlay" hidden>
      <div class="card">
        <h2>暫停中</h2>
        <button id="resumeBtn" class="btn-primary">繼續</button>
      </div>
    </section>

    <!-- 結束 -->
    <section id="overScreen" class="overlay" hidden>
      <div class="card ticket">
        <p class="ticket-head">RUN FOR COINS · 本次車票</p>
        <p id="newBest" class="new-best" hidden>新紀錄！</p>
        <p class="big-score num" id="overScore">0</p>
        <dl class="ticket-grid">
          <div><dt>金幣</dt><dd id="overCoins" class="num">0</dd></div>
          <div><dt>距離</dt><dd id="overDist" class="num">0 m</dd></div>
          <div><dt>最高分</dt><dd id="overBest" class="num">0</dd></div>
        </dl>
        <div class="ticket-actions">
          <button id="againBtn" class="btn-primary">再跑一次</button>
          <button id="menuBtn" class="btn-ghost">回到月台</button>
        </div>
      </div>
    </section>

    <noscript>這個遊戲需要啟用 JavaScript。</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
